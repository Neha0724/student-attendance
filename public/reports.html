<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports & Analytics – Student Attendance System</title>
  <meta name="description" content="View attendance percentages, monthly summaries, and identify defaulters below 75%." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Sidebar Overlay (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🎓</div>
    <h1>AttendEase</h1>
    <span>Management System</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Main</div>
    <a href="index.html" class="nav-link"><span class="icon">🏠</span> Dashboard</a>
    <a href="students.html" class="nav-link"><span class="icon">👥</span> Students</a>
    <a href="attendance.html" class="nav-link"><span class="icon">📋</span> Attendance</a>
    <a href="reports.html" class="nav-link"><span class="icon">📊</span> Reports</a>
  </nav>
  <div class="sidebar-footer">AttendEase v1.0 &copy; 2026</div>
</aside>

<!-- MAIN CONTENT -->
<div class="main-content">
  <header class="topbar">
    <div class="flex-center gap-2">
      <button class="hamburger" id="hamburger">☰</button>
      <h2>Reports & Analytics</h2>
    </div>
    <div class="topbar-right">
      <span class="date-badge" id="dateBadge"></span>
    </div>
  </header>

  <main class="content-area">

    <!-- Top Action Grid: Monthly Summaries -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">📅 Monthly Working Summary</span>
      </div>
      <div id="monthlySummaryWrap" class="month-grid">
        <div class="spinner"></div>
      </div>
    </div>

    <!-- Student Attendance Percentage Matrix -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">📊 Roster Percentages & stats</span>
        
        <!-- Filters inside Header -->
        <div class="report-filters">
          <select id="reportFilterCls" class="form-control" style="width: 150px;" onchange="filterReports()">
            <option value="ALL">All Classes</option>
            <option value="1st">1st</option>
            <option value="2nd">2nd</option>
            <option value="3rd">3rd</option>
            <option value="4th">4th</option>
            <option value="5th">5th</option>
            <option value="6th">6th</option>
            <option value="7th">7th</option>
            <option value="8th">8th</option>
            <option value="9th">6th</option>
          </select>
          <select id="reportFilterDiv" class="form-control" style="width: 140px;" onchange="filterReports()">
            <option value="ALL">All Divisions</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
          <select id="reportFilterStatus" class="form-control" style="width: 170px;" onchange="filterReports()">
            <option value="ALL">All Attendance levels</option>
            <option value="DEFAULTERS">Defaulters (&lt; 75%)</option>
            <option value="GOOD">Good (&gt;= 75%)</option>
          </select>
        </div>
      </div>

      <!-- Scrollable Table -->
      <div id="percentageTableWrap">
        <div class="spinner"></div>
      </div>
    </div>

  </main>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="js/common.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
