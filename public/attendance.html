<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance – Student Attendance System</title>
  <meta name="description" content="Select a date, mark student attendance as present or absent, and save or modify existing logs." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Sidebar Overlay (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🎓</div>
    <h1>AttendEase</h1>
    <span>Management System</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Main</div>
    <a href="index.html" class="nav-link"><span class="icon">🏠</span> Dashboard</a>
    <a href="students.html" class="nav-link"><span class="icon">👥</span> Students</a>
    <a href="attendance.html" class="nav-link"><span class="icon">📋</span> Attendance</a>
    <a href="reports.html" class="nav-link"><span class="icon">📊</span> Reports</a>
  </nav>
  <div class="sidebar-footer">AttendEase v1.0 &copy; 2026</div>
</aside>

<!-- MAIN CONTENT -->
<div class="main-content">
  <header class="topbar">
    <div class="flex-center gap-2">
      <button class="hamburger" id="hamburger">☰</button>
      <h2>Attendance Management</h2>
    </div>
    <div class="topbar-right">
      <span class="date-badge" id="dateBadge"></span>
    </div>
  </header>

  <main class="content-area">

    <!-- Configuration Card -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">📅 Date & Class Filter</span>
        <span id="attendanceStatusBadge" class="badge">Checking status...</span>
      </div>
      <div class="form-grid">
        <!-- Date Selector -->
        <div class="form-group">
          <label for="attDate">Attendance Date</label>
          <input type="date" id="attDate" class="form-control" onchange="handleFilterChange()" />
        </div>
        <!-- Class Selector -->
        <div class="form-group">
          <label for="filterCls">Filter by Class</label>
          <select id="filterCls" class="form-control" onchange="handleFilterChange()">
            <option value="ALL">All Classes</option>
            <option value="FYBCA">FYBCA</option>
            <option value="SYBCA">SYBCA</option>
            <option value="TYBCA">TYBCA</option>
            <option value="FYBA">FYBA</option>
            <option value="SYBA">SYBA</option>
            <option value="TYBA">TYBA</option>
            <option value="FYBSc">FYBSc</option>
            <option value="SYBSc">SYBSc</option>
            <option value="TYBSc">TYBSc</option>
          </select>
        </div>
        <!-- Division Selector -->
        <div class="form-group">
          <label for="filterDivision">Filter by Division</label>
          <select id="filterDivision" class="form-control" onchange="handleFilterChange()">
            <option value="ALL">All Divisions</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Attendance Roster Card -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">📝 Mark Roster (<span id="rosterCount">0</span> Students)</span>
        <div class="flex gap-2">
          <button class="btn btn-outline btn-sm" onclick="markAll('Present')">Mark All Present</button>
          <button class="btn btn-outline btn-sm" onclick="markAll('Absent')">Mark All Absent</button>
        </div>
      </div>

      <!-- Scrollable roster container -->
      <div id="rosterContainer">
        <div class="spinner"></div>
      </div>

      <!-- Save Area -->
      <div class="section-divider"></div>
      <div class="flex gap-2" style="justify-content: flex-end;">
        <span id="saveStatusMsg" class="flex-center text-muted" style="font-size: 0.85rem; margin-right: 12px;"></span>
        <button class="btn btn-primary btn-lg" id="saveAttendanceBtn" onclick="saveAttendance()">💾 Save Attendance</button>
      </div>
    </div>

  </main>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="js/common.js"></script>
<script src="js/attendance.js"></script>
</body>
</html>
