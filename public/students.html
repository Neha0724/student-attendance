<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students – Student Attendance System</title>
  <meta name="description" content="Manage student records – add, edit, search and delete students." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Sidebar Overlay (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">🎓</div>
    <h1>AttendEase</h1>
    <span>Management System</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Main</div>
    <a href="index.html" class="nav-link"><span class="icon">🏠</span> Dashboard</a>
    <a href="students.html" class="nav-link"><span class="icon">👥</span> Students</a>
    <a href="attendance.html" class="nav-link"><span class="icon">📋</span> Attendance</a>
    <a href="reports.html" class="nav-link"><span class="icon">📊</span> Reports</a>
  </nav>
  <div class="sidebar-footer">AttendEase v1.0 &copy; 2026</div>
</aside>

<!-- MAIN CONTENT -->
<div class="main-content">
  <header class="topbar">
    <div class="flex-center gap-2">
      <button class="hamburger" id="hamburger">☰</button>
      <h2>Student Management</h2>
    </div>
    <div class="topbar-right">
      <span class="date-badge" id="dateBadge"></span>
    </div>
  </header>

  <main class="content-area">

    <!-- Add Student Card -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">➕ Add New Student</span>
        <button class="btn btn-outline btn-sm" id="toggleFormBtn" onclick="toggleForm()">Hide Form</button>
      </div>
      <div id="addFormWrap">
        <form id="addStudentForm">
          <div class="form-grid">
            <div class="form-group">
              <label for="rollNo">Roll Number *</label>
              <input type="text" id="rollNo" class="form-control" placeholder="e.g. 101" required />
            </div>
            <div class="form-group">
              <label for="name">Full Name *</label>
              <input type="text" id="name" class="form-control" placeholder="e.g. John Doe" required />
            </div>
            <div class="form-group">
              <label for="cls">Class *</label>
              <select id="cls" class="form-control" required>
                <option value="">Select Class</option>
                <option value="FYBCA">FYBCA</option>
                <option value="SYBCA">SYBCA</option>
                <option value="TYBCA">TYBCA</option>
                <option value="FYBA">FYBA</option>
                <option value="SYBA">SYBA</option>
                <option value="TYBA">TYBA</option>
                <option value="FYBSc">FYBSc</option>
                <option value="SYBSc">SYBSc</option>
                <option value="TYBSc">TYBSc</option>
              </select>
            </div>
            <div class="form-group">
              <label for="division">Division *</label>
              <select id="division" class="form-control" required>
                <option value="">Select Division</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
              </select>
            </div>
          </div>
          <div style="margin-top:16px;">
            <button type="submit" class="btn btn-primary">➕ Add Student</button>
            <button type="button" class="btn btn-outline" onclick="resetAddForm()" style="margin-left:8px;">Clear</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Student List Card -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">👥 All Students <span id="studentCount" class="badge badge-info" style="margin-left:8px;">0</span></span>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" class="form-control" placeholder="Search by name, roll, class..." style="width:250px;" oninput="searchStudents()" />
        </div>
      </div>

      <div id="studentsTableWrap">
        <div class="spinner"></div>
      </div>
    </div>

  </main>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- EDIT STUDENT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3>✏️ Edit Student</h3>
      <button class="modal-close" onclick="closeEditModal()">✕</button>
    </div>
    <div class="modal-body">
      <form id="editStudentForm">
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <div class="form-group">
            <label for="editRollNo">Roll Number *</label>
            <input type="text" id="editRollNo" class="form-control" required />
          </div>
          <div class="form-group">
            <label for="editName">Full Name *</label>
            <input type="text" id="editName" class="form-control" required />
          </div>
          <div class="form-group">
            <label for="editCls">Class *</label>
            <select id="editCls" class="form-control" required>
              <option value="FYBCA">FYBCA</option>
              <option value="SYBCA">SYBCA</option>
              <option value="TYBCA">TYBCA</option>
              <option value="FYBA">FYBA</option>
              <option value="SYBA">SYBA</option>
              <option value="TYBA">TYBA</option>
              <option value="FYBSc">FYBSc</option>
              <option value="SYBSc">SYBSc</option>
              <option value="TYBSc">TYBSc</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editDivision">Division *</label>
            <select id="editDivision" class="form-control" required>
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
            </select>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">💾 Save Changes</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE DIALOG -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-icon">🗑️</div>
    <div class="confirm-title" id="confirmTitle">Delete Student?</div>
    <div class="confirm-msg" id="confirmMsg">This will permanently remove the student and all their attendance records.</div>
    <div class="confirm-actions">
      <button class="btn btn-danger" id="confirmYes">Yes, Delete</button>
      <button class="btn btn-outline" id="confirmNo">Cancel</button>
    </div>
  </div>
</div>

<script src="js/common.js"></script>
<script src="js/students.js"></script>
</body>
</html>
